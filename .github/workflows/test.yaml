name: Test plugin

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: qgis/qgis

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        qgis-version: ["release-3_44", "release-4_0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull QGIS Docker image
        run: docker pull ${DOCKER_IMAGE}:${{ matrix.qgis-version }}

      - name: Validate sources
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ${DOCKER_IMAGE}:${{ matrix.qgis-version }} \
            python3 -m compileall plugin.py data_loader

      - name: Run unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ${DOCKER_IMAGE}:${{ matrix.qgis-version }} \
            python3 -m unittest discover -s test -p "test_*.py"
