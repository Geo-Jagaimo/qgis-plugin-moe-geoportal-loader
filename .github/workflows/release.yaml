name: export_plugin
on:
  release:
    types: [published]
permissions:
  contents: write

env:
  PLUGIN_NAME: moe_geoportal_loader
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the release tag itself so that re-runs always package the same code
      - uses: actions/checkout@v6
      - name: Create Plugin Directory
        run: |
          mkdir ${{env.PLUGIN_NAME}}
          find . -type f | grep -ve './.git' \
            -ve '.github' \
            -ve './.vscode' \
            -ve '__pycache__/' \
            -ve './test' \
            -ve './tests' \
            -ve './pyproject.toml' \
            -ve './.gitignore' \
            -ve './.python-version' \
            -ve './README.md' \
            -ve './uv.lock' \
            -ve './.venv' \
            -ve './.ruff_cache' \
            -ve './.DS_Store' | xargs -I src cp --parents src ${{env.PLUGIN_NAME}}
      # Write version information in metadata.txt from github release tag
      - name: Write version to metadata.txt
        run: |
          TAG=${{ github.event.release.tag_name }}
          VERSION=${TAG#v}
          sed -i "s/^version=.*/version=${VERSION}/" ${{env.PLUGIN_NAME}}/metadata.txt
          grep '^version=' ${{env.PLUGIN_NAME}}/metadata.txt
      - name: Create Archive
        run: |
          zip -r ${{env.PLUGIN_NAME}}.zip ./${{env.PLUGIN_NAME}}
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} ${{env.PLUGIN_NAME}}.zip#${{env.PLUGIN_NAME}} --clobber
      # Pre-releases are published on GitHub only
      - name: Upload to plugins.qgis.org
        if: ${{ !github.event.release.prerelease }}
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          if [ -z "${QGIS_PLUGIN_TOKEN}" ]; then
            echo "::error::Secret QGIS_PLUGIN_TOKEN is not set"
            exit 1
          fi
          # auto_approve_after_scan publishes the version as soon as the security scan passes.
          # It only takes effect when the token owner has the can_approve permission;
          # otherwise the version waits for manual approval.
          curl -X POST \
            "https://plugins.qgis.org/plugins/api/${{env.PLUGIN_NAME}}/version/add/" \
            -H "Authorization: Bearer ${QGIS_PLUGIN_TOKEN}" \
            -F "package=@${{env.PLUGIN_NAME}}.zip" \
            -F "auto_approve_after_scan=true" \
            --silent --show-error --fail-with-body
